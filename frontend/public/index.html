<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F5F0" />
    <meta name="description" content="BukkaPay - The Future of African Payments. Send, receive, and collect payments seamlessly across borders." />
    <meta name="keywords" content="BukkaPay, African payments, digital wallet, payment links, invoices, cross-border payments" />
    <meta name="author" content="BukkaPay" />
    <meta property="og:title" content="BukkaPay - The Future of African Payments" />
    <meta property="og:description" content="Send, receive, and collect payments seamlessly across borders. Built for freelancers, businesses, and businesses across Africa." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bukkapay.com" />
    <meta property="og:image" content="https://bukkapay.com/assets/logo.png" />
    <link rel="icon" href="/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet" />
    <title>BukkaPay - The Future of African Payments</title>
    <style>
        #lovable-badge,[id*="lovable"],[class*="lovable"],a[href*="lovable"],
        iframe[src*="lovable"],div[style*="Lovable"],div[style*="lovable"] {
            display:none!important;visibility:hidden!important;opacity:0!important;
            pointer-events:none!important;position:fixed!important;bottom:-1000px!important;
            right:-1000px!important;z-index:-9999!important;
        }
    </style>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org","@type": "FinancialService","name": "BukkaPay",
      "url": "https://bukkapay.com","logo": "https://bukkapay.com/assets/logo.png",
      "description": "BukkaPay is a unified payment platform enabling businesses and individuals to send, receive, and collect payments seamlessly across Africa.",
      "areaServed": {"@type": "Place","name": "Africa"},
      "sameAs": ["https://x.com/BukkaPay","https://www.instagram.com/bukkapay"]
    }
    </script>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
        function removeBadges() {
            document.querySelectorAll('[id*="lovable"],[class*="lovable"],a[href*="lovable"],iframe[src*="lovable"],[id*="emergent"],[class*="emergent"],a[href*="emergent.sh"]').forEach(el=>el.remove());
        }
        removeBadges();setInterval(removeBadges,1000);
    </script>
</body>
</html>
